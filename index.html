<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxy Boom</title>
<style>
:root{color-scheme:dark;--bg:#0b0626;--card:#1d1450;--line:#6a4fe0;--tx:#f2ecff;--mut:#a99be0;--gold:#ffc83d;--ok:#3ddc97;--bad:#ff5c7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0626}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 10%,#3b1a8f,transparent 50%),radial-gradient(circle at 90% 80%,#1b3a9f,transparent 50%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:44px;margin:8px 0;text-align:center;background:linear-gradient(90deg,#fff,#ffc83d);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:6px 0 12px;font-size:20px;text-align:center}
.btn{display:block;width:100%;margin:10px 0;padding:14px;border:2px solid var(--line);border-radius:16px;background:linear-gradient(#4a35b8,#2d2080);color:var(--tx);font-size:17px;font-weight:700;cursor:pointer}
.btn.gold{background:linear-gradient(#ffc83d,#ff9a1f);color:#2a1500;border-color:#ffe08a}
.btn:disabled{opacity:.45}
.card{background:rgba(29,20,80,.85);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700}
.bar{height:12px;border-radius:8px;background:#2a1f6b;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad))}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.lv small{font-size:10px;color:var(--gold)}.lv.lock{opacity:.4;cursor:default}
input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:#120a3a;color:var(--tx);font-size:17px}
.row{display:flex;justify-content:space-between;padding:10px 6px;border-bottom:1px solid #3a2c85}
.row.me{background:#3a2c85;border-radius:10px}
.big{font-size:56px;text-align:center;letter-spacing:6px}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:300px;margin:12px auto}
.pz div{aspect-ratio:1;border-radius:6px;cursor:pointer;background-size:300% 300%}
.pz div.sel{outline:3px solid var(--gold)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mem div{aspect-ratio:1;border-radius:14px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer}
.mem div.open{background:#3a2c85}.mem div.done{background:#145a3c;border-color:var(--ok)}
.btn.bad{background:#7a1f35;border-color:var(--bad)}.btn.good{background:#145a3c;border-color:var(--ok)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.muted{color:var(--mut);font-size:14px;text-align:center}
.pz div{position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}.pz div.ok{box-shadow:inset 0 0 0 3px var(--ok)}.pz div span{position:absolute;top:3px;left:6px;font:700 13px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}.pz{max-width:340px;gap:4px}.pg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-width:340px;margin:8px auto}.pg i{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(14px,5vw,24px);border-radius:6px}.pw{background:#3a2c85}.pc{background:#120a3a}.dp{display:grid;grid-template-columns:repeat(3,76px);gap:6px;justify-content:center;margin-top:8px}.dp button{height:60px;font-size:22px;border-radius:12px;border:2px solid var(--line);background:#2d2080;color:var(--tx)}</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
let S={name:'',score:0,stars:{},best:{}},col=null,me=null,rows=[],cur='home',G=null;
try{Object.assign(S,JSON.parse(localStorage.getItem('gb')||'{}'))}catch(e){}
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const CFG={url:'',key:''}; // <- Supabase URL и anon key (виж README.md)
let mode='local',LV;
try{me=localStorage.getItem('gbid');if(!me){me=Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('gbid',me)}}catch(e){me='p'+Date.now()}
function pl(){return{name:S.name,score:S.score,stars:sum(S.stars),levels:Object.keys(S.stars).length,map:{stars:S.stars,best:S.best}}}
function sb(m,q,body,h){return fetch(CFG.url+'/rest/v1/players'+q,{method:m,headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',...h},body:body&&JSON.stringify(body)}).then(r=>r.ok?r.text():Promise.reject())}
function save(){
  try{localStorage.setItem('gb',JSON.stringify(S))}catch(e){}
  if(!S.name)return;
  if(mode==='claude')col.doc(me).set(pl()).catch(()=>{});
  else if(mode==='sb')sb('POST','?on_conflict=id',{id:me,...pl()},{Prefer:'resolution=merge-duplicates,return=minimal'}).catch(()=>{});
}
async function pollLb(){try{rows=JSON.parse(await sb('GET','?select=id,name,score,stars&order=score.desc&limit=50'));if(cur==='lb')lb()}catch(e){}}
(async()=>{
  try{if(window.claude){
    const u=await claude.use('user'),db=await claude.use('db');
    if(u&&db){me=String(await u.id());col=db.collection('players');mode='claude';
      const d=await col.doc(me).get();
      if(d.exists){const x=d.data();if(x.name&&!S.name)S.name=x.name;if((x.score||0)>S.score&&x.map){S.score=x.score;S.stars=x.map.stars||{};S.best=x.map.best||{}}}
      col.onSnapshot(q=>{rows=q.docs.map(d=>({id:d.id,...d.data()}));if(cur==='lb')lb()},()=>{});}
  }}catch(e){}
  if(mode==='local'&&CFG.url){mode='sb';pollLb();setInterval(pollLb,5000)}
  save();if(cur==='home')home();
})();

function show(h,name){cur=name;A.innerHTML=h;window.scrollTo(0,0)}
function home(){
  if(!S.name)return reg();
  show(`<h1>Galaxy Boom</h1><div class="big">🚀</div>
  <div class="card top"><span>👨‍🚀 ${esc(S.name)}</span><span class="chip">⭐ ${S.score} т.</span></div>
  <button class="btn gold" onclick="levels()">Играй</button>
  <button class="btn" onclick="levels()">Нива</button>
  <button class="btn" onclick="lbShow()">🏆 Класация</button>
  <button class="btn" onclick="ach()">Постижения</button>
  <p class="muted">${mode==='local'?'Офлайн режим – класацията още не е свързана (виж README).':'Класацията е на живо за всички играчи.'}</p>`,'home');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function reg(){
  show(`<h1>Galaxy Boom</h1><div class="big">👨‍🚀</div><h2>Регистрирай се, за да влезеш в класацията</h2>
  <input id="nm" maxlength="16" placeholder="Твоят псевдоним"><button class="btn gold" onclick="doReg()">Старт</button>`,'reg');
}
function doReg(){const v=$('#nm').value.trim();if(v.length<2)return;S.name=v;save();home()}
function play(i){
  const L=LV[i];G={i,left:LV[i].time||30,max:LV[i].time||30,done:false};
  show(`<div class="top"><button class="chip" onclick="stop();levels()">←</button><b>Ниво ${i+1} – ${L.t}</b><span class="chip" id="tm">30</span></div>
  <div class="bar"><i id="bar"></i></div><div id="box"></div>`,'play');
  G.iv=setInterval(()=>{G.left-=.1;upd();if(G.left<=0)end(false)},100);
  L.m($('#box'),()=>end(true));
}
function upd(){const l=Math.max(0,G.left);$('#tm').textContent=Math.ceil(l);$('#bar').style.width=l/G.max*100+'%'}
function pen(s){G.left=Math.min(G.max,G.left-s);upd()}
function stop(){if(G)clearInterval(G.iv)}
function end(win){
  if(G.done)return;G.done=true;stop();
  const n=G.i+1,left=Math.max(0,G.left);
  if(!win){return show(`<h2>⏰ Времето изтече!</h2><div class="big">💥</div><button class="btn gold" onclick="play(${G.i})">Опитай пак</button><button class="btn" onclick="levels()">Към нивата</button>`,'res')}
  const pts=(100+Math.ceil(left)*10)*(LV[G.i].boss?2:1),st=left>G.max*.66?3:left>G.max*.33?2:1,gain=Math.max(0,pts-(S.best[n]||0));
  S.best[n]=Math.max(S.best[n]||0,pts);S.stars[n]=Math.max(S.stars[n]||0,st);S.score+=gain;save();
  const nx=n<LV.length;
  show(`<h2>Ниво завършено!</h2><div class="big">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <p class="muted">+${pts} точки · общо ${S.score}</p>
  <div class="card"><b>🪐 Любопитен факт</b><p>${LV[G.i].f}</p></div>
  ${nx?`<button class="btn gold" onclick="play(${n})">Следващо ниво</button>`:`<div class="card">🎉 Завърши всички налични нива! Още идват скоро.</div>`}
  <button class="btn" onclick="lbShow()">🏆 Класация</button><button class="btn" onclick="levels()">Към нивата</button>`,'res');
}
function lbShow(){cur='lb';lb()}
function lb(){
  let r=rows.slice();if(mode==='local'&&S.name)r=[{id:'me',name:S.name,score:S.score,stars:sum(S.stars)}];
  r.sort((a,b)=>(b.score||0)-(a.score||0));
  const h=r.slice(0,50).map((p,i)=>`<div class="row ${p.id===me||p.id==='me'?'me':''}"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(p.name||'Играч')}</span><span>${p.score||0} т. · ⭐${p.stars||0}</span></div>`).join('')||'<p class="muted">Още няма играчи.</p>';
  show(`<div class="top"><button class="chip" onclick="home()">←</button></div><h2>🏆 Класация на живо</h2><div class="card">${h}</div>`,'lb');
}
function ach(){
  const n=Object.keys(S.stars).length,s=sum(S.stars);
  const B=[['🥇','Първа мисия',n>=1],['⭐','10 звезди',s>=10],['🏆','Всички 40 нива',n>=LV.length],['👾','Победен бос',!!(S.stars[10]||S.stars[20]||S.stars[30])],['💯','1000 точки',S.score>=1000],['🪐','Астроном',n>=3]];
  show(`<div class="top"><button class="chip" onclick="home()">←</button></div><h2>Постижения</h2>`+B.map(b=>`<div class="card top" style="opacity:${b[2]?1:.4}"><span>${b[0]} ${b[1]}</span><span>${b[2]?'✓':'🔒'}</span></div>`).join(''),'ach');
}

function quiz(b,q,opts,ans,w){
  b.innerHTML=`<div class="card"><p style="font-size:18px;margin:0">${q}</p></div>`+opts.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')+`<p class="muted">Грешен отговор = −5 секунди</p>`;
  b.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{
    if(+bt.dataset.i===ans){bt.classList.add('good');setTimeout(w,300)}
    else{bt.classList.add('bad','shake');bt.disabled=true;pen(5)}
  });
}
function order(b,w,P,qq){
  const sh=P.slice().sort(()=>Math.random()-.5);let k=0;
  b.innerHTML=`<div class="card"><p style="margin:0;font-size:18px">${qq}</p></div>`+sh.map(p=>`<button class="btn">${p}</button>`).join('')+`<p class="muted">Грешка = −3 секунди</p>`;
  b.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{
    if(bt.textContent===P[k]){bt.classList.add('good');bt.disabled=true;if(++k===P.length)setTimeout(w,300)}
    else{bt.classList.add('shake');setTimeout(()=>bt.classList.remove('shake'),300);pen(3)}
  });
}
function memory(b,w,E){
  const c=E.concat(E).sort(()=>Math.random()-.5);let op=[],lock=false,got=0;
  b.innerHTML=`<p class="muted">Намери всички двойки!</p><div class="mem" style="grid-template-columns:repeat(${E.length>3?4:3},1fr)">`+c.map((_,i)=>`<div data-i="${i}">❓</div>`).join('')+`</div>`;
  const el=b.querySelectorAll('.mem div');
  el.forEach(d=>d.onclick=()=>{
    const i=+d.dataset.i;if(lock||op.includes(i)||d.classList.contains('done'))return;
    d.textContent=c[i];d.classList.add('open');op.push(i);
    if(op.length===2){lock=true;const[a,z]=op;
      setTimeout(()=>{
        if(c[a]===c[z]){[a,z].forEach(x=>{el[x].className='done'});got++;if(got===E.length)w()}
        else{[a,z].forEach(x=>{el[x].className='';el[x].textContent='❓'});pen(2)}
        op=[];lock=false},500)}
  });
}
function puzzle(b,w,hue){
  const bg='radial-gradient(circle at 62% 42%,#6fe3d0 0 9%,#2f7fd6 10% 22%,transparent 23%),radial-gradient(circle at 18% 82%,#ff9a1f 0 6%,transparent 7%),radial-gradient(circle at 85% 12%,#fff 0 1.5%,transparent 2%),linear-gradient(135deg,#150a45,#5a1fa8)';
  let p=[0,1,2,3,4,5,6,7,8];do{p.sort(()=>Math.random()-.5)}while(p.every((v,i)=>v===i));let sel=-1;
  function r(){
    b.innerHTML=`<p class="muted">Докосни две части, за да ги размениш</p><div class="pz" style="filter:hue-rotate(${hue}deg)">`+p.map((v,i)=>`<div class="${i===sel?'sel':''}" data-i="${i}" style="background:${bg};background-size:300% 300%;background-position:${v%3*50}% ${Math.floor(v/3)*50}%"></div>`).join('')+`</div>`;
    b.querySelectorAll('.pz div').forEach(d=>d.onclick=()=>{
      const i=+d.dataset.i;
      if(sel<0){sel=i;r()}else{[p[sel],p[i]]=[p[i],p[sel]];sel=-1;r();if(p.every((v,j)=>v===j))setTimeout(w,300)}
    });
  }r();
}
const Q=[
['Коя планета е известна като Червената планета?',['Венера','Марс','Меркурий','Юпитер'],1,'Марс е червен заради железен оксид (ръжда) в почвата му.'],
['Колко планети има в Слънчевата система?',['7','8','9','10'],1,'Плутон е прекласифициран като планета джудже през 2006 г.'],
['Коя е най-близката до Земята звезда?',['Сириус','Проксима Кентавър','Слънцето','Полярната'],2,'Слънцето съдържа около 99,8% от масата на Слънчевата система.'],
['Как се нарича естественият спътник на Земята?',['Луна','Фобос','Титан','Европа'],0,'Луната се отдалечава от Земята с около 3,8 см годишно.'],
['Коя планета се върти почти легнала настрани?',['Нептун','Уран','Марс','Венера'],1,'Наклонът на Уран е около 98°, затова сезоните му траят по над 20 години.'],
['Какво е галактика?',['Огромна система от звезди, газ и прах','Вид комета','Голяма планета','Изгаснала звезда'],0,'Във Вселената има стотици милиарди галактики.'],
['Как се казва нашата галактика?',['Андромеда','Млечният път','Триъгълник','Вихър'],1,'Млечният път съдържа стотици милиарди звезди.'],
['Какво е светлинна година?',['Време за оборот на Земята','Разстоянието, което светлината изминава за година','Скорост на звука','Възраст на звезда'],1,'Една светлинна година е около 9,46 трилиона километра.'],
['Кой е първият човек в космоса?',['Нийл Армстронг','Юрий Гагарин','Бъз Олдрин','Джон Глен'],1,'Юрий Гагарин облита Земята на 12 април 1961 г.'],
['Коя планета е най-гореща?',['Меркурий','Венера','Марс','Юпитер'],1,'На Венера температурата достига около 465 °C заради гъстата атмосфера.'],
['Какво е черна дупка?',['Област, от която и светлината не може да излезе','Тъмна планета','Празно пространство','Изгаснала комета'],0,'Черните дупки се образуват най-често след колапса на огромни звезди.'],
['Колко земни дни продължава една година на Марс?',['365','687','225','88'],1,'Денят на Марс е почти като нашия – около 24 часа и 37 минути.'],
['Кой е най-големият спътник на Сатурн?',['Титан','Луна','Йо','Тритон'],0,'Титан има гъста атмосфера и езера от течен метан.'],
['За колко време светлината от Слънцето стига до Земята?',['8 секунди','8 минути','8 часа','8 дни'],1,'Виждаме Слънцето такова, каквото е било преди около 8 минути.']
];
const O=[
[['Меркурий','Венера','Земя','Марс','Юпитер'],'Докосни планетите по ред – от най-близката до Слънцето ☀️','Меркурий е най-близо до Слънцето, но най-гореща е Венера.'],
[['Марс','Юпитер','Сатурн','Уран','Нептун'],'Подреди по ред от Слънцето – започни с Марс ☀️','Между Марс и Юпитер е астероидният пояс.'],
[['Меркурий','Марс','Венера','Земя'],'Подреди планетите от най-малката до най-голямата 📏','Меркурий е само малко по-голям от нашата Луна.'],
[['Земя','Нептун','Уран','Сатурн','Юпитер'],'Подреди от най-малката до най-голямата 📏','Юпитер е по-голям от всички останали планети, взети заедно.']
];
const M=[
[['🪐','🌍','🚀'],'На Марс има най-големия вулкан в Слънчевата система – Олимп Монс, висок около 22 км.'],
[['🌙','☄️','👽','🛸'],'Кометите имат опашка само когато са близо до Слънцето.'],
[['⭐','🌞','🛰️','🪐','🌌','🚀'],'Първият изкуствен спътник, Спутник 1, е изстрелян през 1957 г.']
];
M.push([['🌟','🧑‍🚀','🛰️','🔭','🌠'],'Телескопът Хъбъл обикаля Земята от 1990 г. и е направил над милион наблюдения.']);
const PF=['Пръстените на Сатурн са широки над 280 000 км, но дебели едва няколко десетки метра.','Земята е единствената позната ни планета с течна вода на повърхността.','Нептун има най-силните ветрове в Слънчевата система – над 2 000 км/ч.','Ако Слънцето беше с размерите на входна врата, Земята щеше да е монета.'];
const R=n=>Math.floor(Math.random()*n);
function shipQ(){let t,s,tot,m;do{t=[4+R(6),4+R(6),3+R(5)];s=1+R(3);tot=[t[0],t[1],t[2]+s];m=Math.min(...tot)}while(tot.filter(x=>x===m).length>1);
return[`Кораб А лети ${t[0]} мин., Б – ${t[1]} мин., В – ${t[2]} мин., но спира за ${s} мин. Кой пристига първи?`,['Кораб А','Кораб Б','Кораб В'],tot.indexOf(m)]}
function qz(b,qs,w){let k=0;(function nx(){const q=qs[k];quiz(b,(qs.length>1?'('+(k+1)+'/'+qs.length+') ':'')+q[0],q[1],q[2],()=>{if(++k===qs.length)w();else nx()})})()}
function asteroids(b,w,p){
 let left=5+2*p;

function levels(g){
